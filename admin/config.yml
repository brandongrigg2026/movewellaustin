backend:
  name: git-gateway
  branch: main

media_folder: "images/upload"
public_folder: "/images/upload"

collections:
  - name: "site"
    label: "Website Content"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "content/homepage.yml"
        fields:
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Description", name: "hero_description", widget: "text" }
          - { label: "Price", name: "price", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Rebecca Bio", name: "bio", widget: "text" }
